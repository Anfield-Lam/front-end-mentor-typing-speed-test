<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Typing Speed Test</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center;}
    .attribution a { color: hsl(228, 45%, 44%); }

    @font-face {
      font-family: 'Sora';
      src: url('fonts/static/Sora-Regular.ttf') format('truetype');
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: 'Sora';
      src: url('fonts/static/Sora-SemiBold.ttf') format('truetype');
      font-style: normal;
      font-weight: 600;
    }

    @font-face {
      font-family: 'Sora';
      src: url('fonts/static/Sora-Bold.ttf') format('truetype');
      font-style: normal;
      font-weight: 700;
    }

    :root {
      --black: hsl(0, 0%, 7%);
      --white: hsl(0, 0%, 100%);
      --lighter-black: hsl(0, 0%, 15%);
      --grey: hsl(240, 3%, 46%);
      --blue: hsl(214, 100%, 55%);
      --light-grey: hsl(240, 1%, 59%);
    }

    body {
      margin: 0 auto;
      font-family: 'Sora', sans-serif;
      font-weight: 400;
      background-color: var(--black);
      color: var(--white);
      letter-spacing: 0.05em;
      user-select: none;
      overflow: hidden;
    }

    .header-container {
      margin: 0.5rem;
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
    }

    .header-container > .right {
      display: flex;
      align-items: center;
      justify-items: center;
    }

    .second-header-container > .left {
      display: flex;;
      justify-content: space-evenly;
      align-items: center;
      margin: 0 -0.5rem;
    }

    .item {
      flex: 1;
      text-align: center;
      padding: 1rem;
      min-height: 5vh;
    }

    .divider {
      border: 0.5px solid var(--grey);
      height: 3rem;
    }

    .item .left {
      color: grey;
      padding-bottom: 0.5rem;
    }

    .item .right {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .personal-best {
      display: flex;
    }

    .personal-best .left {
      color: var(--grey);
    }

    .personal-best .right {
      font-weight: 700;
    }

    img {
      max-height: 100%; 
      width: auto
    }

    .second-header-container > .right {
      display: flex;
      justify-content: space-around;
    }

    .difficulty, 
    .mode {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--white);
      border-radius: 8px;
      margin: 0.5rem;
      min-height: 2.2rem;
      font-size: 1.1rem;
      font-weight: 400;
      cursor: pointer;
    }

    .difficulty img, .mode img {
      padding-left: 0.5rem;
      padding-right: -0.5rem;
    }

    .options {
      position: absolute;
      display: flex;
      justify-content: space-around;
      width: 100%;
    }

    .hidden{
      visibility: hidden;
    }

    .outer-difficulty-list, .outer-mode-list {
      display: flex;
      flex: 1;
    }

    .outer-mode-list {
      left: 50%;
      height: 66.7%
    }

    .outer-mode-list, .outer-difficulty-list {
      margin: 0.1rem 0.5rem;
    }

    .mode-list, .difficulty-list {
      background-color: var(--lighter-black);
      width: 100%;
      border-radius: 8px;
    }
    .easy, .medium, .hard, .timed, .passage{
      display: flex;
      align-items: center;
      padding: 0.75rem;
      cursor: pointer;
    }

    .medium, .passage{
      border-top: 1px solid var(--grey)
    }

    .medium {
      border-bottom: 1px solid var(--grey)
    }

    .border-line {
      border-bottom: 0.5px solid var(--grey);
      margin: 0.5rem;
    }

    .content {
      display: flex;
      flex-direction: column;
      min-height: 75vh; /* full viewport height */
      align-items: center;
      justify-content: center;
    }

    .passage-shown {
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--grey);
      padding: 0.5rem;
      line-height: 1.4;
    }

    .header {
      min-height: 12.2rem;
    }    

    .start-screen {
      font-size: 1.5rem;
      font-weight: 400;
      text-align: center;
    }

    .start-button {
      background-color: var(--blue);
      padding: 1rem;
      margin: 1.4rem 3.5rem;
      border-radius: 15px;
      cursor: pointer;
    }

    .trophy {
      padding-right: 0.8rem;
    }

    .personal-best .left {
      padding-right: 0.1rem;
    }

    .personal-best .right {
      font-weight: 400;
    }

    .closed {
      display: None;
    }

    .passage-container {
      min-height: 75vh;
    }

    .blurred {
      position: absolute;
      filter: blur(6.7px);
      pointer-events: none;
      top: 14rem;
    }

    .restart-test-container {
      position: absolute;
      display: flex;
      bottom: 0;
      height: 9rem;
      font-size: 1.4rem;
      width: 100%;
      flex-direction: column;
      justify-content: flex-end;;
      background-color: var(--black);
    }

    .restart-test-container-border {
      height: 6rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .restart-button {
      display: flex;
      background-color: var(--lighter-black);
      padding: 1rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .restart-icon {
      padding-left: 0.5rem; 
    }

    span.curr {
      background-color: var(--light-grey);
      border-radius: 5px;
    }

  </style>
</head>
<body>
  <div class="header">
    <div class="header-container">
      <div class="left">
        <img src="assets/images/logo-small.svg">
      </div>
      <div class="right">
        <img class="trophy" src="assets/images/icon-personal-best.svg">
        <div class="personal-best">
          <div class="left">Best: </div> 
          <div class="right">92 WPM</div>
        </div>
      </div>
    </div>

    <div class="second-header-container">
      <div class="left">
        <div class="item wpm">
          <div class="left">WPM: </div>
          <div class="right">0</div>
        </div>
        <div class="divider"></div>
        <div class="item accuracy">
          <div class="left">Accuracy: </div>
          <div class="right">100%</div>
        </div>
        <div class="divider"></div>
        <div class="item time">
          <div class="left">Time: </div>
          <div class="right">0:60</div>
        </div>
      </div>
      <div class="right">
        <div class="difficulty">
          <div class="difficulty-selected">Easy</div>
          <img src="assets/images/icon-down-arrow.svg">
        </div>
        <div class="mode">
          <div class="mode-selected">Timed (60s)</div>
          <img src="assets/images/icon-down-arrow.svg">
        </div>
      </div>
      <div class="options">
        <div class="outer-difficulty-list hidden">
          <div class="difficulty-list">
            <div class="easy active">Easy</div>
            <div class="medium">Medium</div>
            <div class="hard">Hard</div>
          </div>
        </div>
        <div class="outer-mode-list hidden">
          <div class="mode-list">
            <div class="timed active">Timed (60s)</div>
            <div class="passage">Passage</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="border-line"></div>

  <div class="content">
    <div class="start-screen">
      <div class="start-button">Start Typing Test</div>
      <div class="text-below-start-button">Or click the text and start typing</div>
    </div>
    <div class="passage-container blurred">
      <div class="padding-on-top-of-restart-button">
        <div class="passage-shown">
        </div>
      </div>
    </div>
    <div class="restart-test-container hidden">
      <div class="border-line"></div>
      <div class="restart-test-container-border">
        <div class="restart-button">
          Restart Test <img class="restart-icon" src="./assets/images/icon-restart.svg">
        </div>
      </div>
    </div>
  </div>
  <!-- Passage -->

  
  

  <!-- Test Complete Start -->

  <!-- Test Complete! -->
  <!-- Solid run. Keep pushing to beat your high score. -->

   <!-- WPM:  WPM -->
  <!-- Accuracy:  Accuracy -->
  <!-- Characters:  Correct/Incorrect --> 

  <!-- Go Again -->
  
  <!-- Test Complete End -->

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script defer src="script.js"></script>
</body>
</html>
