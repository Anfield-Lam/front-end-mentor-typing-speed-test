<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Typing Speed Test</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    @font-face {
      font-family: 'Sora';
      src: url('fonts/static/Sora-Regular.ttf') format('truetype');
      font-weight: 400;
    }

    @font-face {
      font-family: 'Sora';
      src: url('fonts/static/Sora-SemiBold.ttf') format('truetype');
      font-weight: 600;
    }

    @font-face {
      font-family: 'Sora';
      src: url('fonts/static/Sora-Bold.ttf') format('truetype');
      font-weight: 700;
    }

    body {
      margin: 0;
      font-family: 'Sora', sans-serif;
      font-weight: 400;
      background-color: black;
      color: white;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      padding: 0.5rem;
    }

    .header-container > .right {
      display: flex;
      align-items: center;
      justify-items: center;
    }

    .second-header-container > .left {
      display: flex;;
      justify-content: space-evenly;
      align-items: center;
    }

    .item {
      flex: 1;
      text-align: center;
      padding: 1rem;
      min-height: 5vh;
    }

    .divider {
      border: 0.5px solid grey;
      height: 3rem;
    }

    .item .left {
      color: grey;
      padding-bottom: 0.5rem;
    }

    .item .right {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .personal-best {
      display: flex;
    }

    .personal-best .left {
      color: grey;
    }

    .personal-best .right {
      font-weight: 700;
    }

    img {
      max-height: 100%; 
      width: auto
    }

    .second-header-container > .right {
      display: flex;
      justify-content: space-around;
    }

    .second-header-container > .right > .left, 
    .second-header-container > .right > .right {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      border: 1px solid white;
      border-radius: 5px;
      margin: 0.5rem;
      height: 3vh
    }

    .second-header-container > .right > .left select, 
    .second-header-container > .right > .right select{
      width: 100%;
      background-color: black;
      color: white;
      border: 0;
      cursor: pointer;
    }

    .second-header-container > .right > .left select:focus, 
    .second-header-container > .right > .right select:focus{
      outline: none;
    }

    .second-header-container > .right > .left option, 
    .second-header-container > .right > .right option {
      text-align: center;
    } 

    option.first {
      margin-top: 5rem;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <div class="left">
      <img src="assets/images/logo-small.svg">
    </div>
    <div class="right">
      <img src="assets/images/icon-personal-best.svg">
      <div class="personal-best">
        <div class="left">Best: </div> 
        <div class="right">92 WPM</div>
      </div>
    </div>
  </div>

  <div class="second-header-container">
    <div class="left">
      <div class="item wpm">
        <div class="left">WPM: </div>
        <div class="right">0</div>
      </div>
      <div class="divider"></div>
      <div class="item accuracy">
        <div class="left">Accuracy: </div>
        <div class="right">100%</div>
      </div>
      <div class="divider"></div>
      <div class="item time">
        <div class="left">Time: </div>
        <div class="right">0:60</div>
      </div>
    </div>
    <div class="right">
      <label class="left" for="difficulty">
        <select name="difficulty" id="difficulty">
          <option class="first" value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <label class="right" for="mode">
        <select name="mode" id="mode">
          <option class="first" value="timed">Timed (60s)</option>
          <option value="passage">Passage</option>
        </select>
      </label>
    </div>
  </div>

  <div class=""></div>
  <!-- Passage -->

  Start Typing Test
  Or click the text and start typing

  <!-- Test Complete Start -->

  Test Complete!
  Solid run. Keep pushing to beat your high score.

  WPM: <!-- WPM -->
  Accuracy: <!-- Accuracy -->
  Characters: <!-- Correct/Incorrect -->

  Go Again
  
  <!-- Test Complete End -->

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script defer src="script.js"></script>
</body>
</html>
